name: CodeQL

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:trixie

    steps:
      - name: Install checkout dependency
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxft-dev libxinerama-dev \
            libxrender-dev libimlib2-dev libxcb1-dev libxcb-res0-dev \
            libfontconfig1-dev libfreetype-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: scripts/run-tests make clean all

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.1
